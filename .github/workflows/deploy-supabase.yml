name: Deploy Supabase Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'

permissions:
  contents: read

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    environment: production-supabase
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate & Deploy Supabase Migrations and Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF secret not configured yet — skipping remote deploy."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt youtube-oauth-callback
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt instagram-oauth-callback
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
