<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Insta to YouTube</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="static/styles.css">
  <script src="static/login.js" defer></script>
</head>
<body class="login-page">
  <form id="login-form" class="card login-card">
    <div class="brand">
      <span class="logo" aria-hidden="true">&#9654;</span>
      <div>
        <div class="brand-name">Insta &rarr; YouTube</div>
        <div class="brand-sub">Admin login</div>
      </div>
    </div>
    <label class="field">Admin password
      <input id="password" type="password" autocomplete="current-password" required autofocus>
    </label>
    <p id="login-error" class="error" hidden></p>
    <button class="btn primary wide" type="submit">Log in</button>
    <p class="hint">The password is <code>ADMIN_PASSWORD</code> in your <code>.env</code> file.</p>
  </form>
</body>
</html>
